name: 빌드 및 릴리스

# v로 시작하는 태그(v0.1.0 등)를 올리면 설치 파일을 빌드해 GitHub 릴리스에 올린다.
# Actions 탭에서 수동 실행하면 빌드만 하고 결과물을 아티팩트로 남긴다.
#
# 필요한 저장소 비밀값(Settings → Secrets and variables → Actions)
# - TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 자동 업데이트 서명 키 (없으면 빌드 실패)
# - VT_API_KEY: VirusTotal API 키 (없으면 검사를 건너뛰고 릴리스 노트에 결과 링크만 넣는다)
#
# 릴리스 노트에 넣을 변경 내용은 주석 태그 메시지로 적는다: git tag -a v0.3.0 --cleanup=verbatim -F 노트.md
# (--cleanup=verbatim이 없으면 git이 #으로 시작하는 줄을 주석으로 보고 지운다)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # 주석 태그의 메시지를 읽으려면 태그 객체까지 받아야 한다.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # rust-cache가 ~/.cargo/bin도 캐시하므로 두 번째 실행부터는 설치를 건너뛴다.
      - name: Tauri CLI 설치
        run: cargo install tauri-cli --version "^2" --locked

      # 태그 이름(v1.2.3)에서 버전을 가져와 설치 파일 버전에 넣는다.
      - name: 태그 버전 적용
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $path = 'src-tauri/tauri.conf.json'
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8NoBOM

      # 설치 파일과 함께 자동 업데이트용 서명(.sig)도 만든다.
      - name: 빌드
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      # 포터블: 설치 없이 압축만 풀어 실행한다. 실행 파일 옆에 확장 폴더가 있어야 한다.
      - name: 포터블 zip 만들기
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $dir = "Moabom-$version-portable"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item src-tauri/target/release/moabom.exe "$dir/Moabom.exe"
          Copy-Item -Recurse src-tauri/extensions "$dir/extensions"
          Compress-Archive -Path "$dir/*" -DestinationPath "moabom_${version}_x64-portable.zip"

      # 앱이 새 버전을 확인할 때 읽는 파일(releases/latest/download/latest.json)과 릴리스 노트를 만든다.
      - name: 업데이트 정보·릴리스 노트 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $repo = "${{ github.repository }}"
          $setup = Get-Item "src-tauri/target/release/bundle/nsis/*_x64-setup.exe"
          $zip = Get-Item "moabom_${version}_x64-portable.zip"
          $exe = Get-Item "src-tauri/target/release/moabom.exe"

          # 주석 태그 메시지를 변경 내용으로 쓴다(가벼운 태그면 비어 있다).
          # checkout이 태그를 메시지 없는 태그로 다시 만들어 두므로, 원래 태그를 다시 받아 덮어쓴다.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          if (-not $notes) { $notes = "모아봄 $tag" }

          $latest = [ordered]@{
            version  = $version
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
                url       = "https://github.com/$repo/releases/download/$tag/$($setup.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 8 | Set-Content latest.json -Encoding utf8NoBOM

          # VirusTotal: 키가 있으면 올려서 검사를 시작하고, 결과 페이지 링크(파일 해시)를 노트에 넣는다.
          # 결과가 나오기까지 몇 분 걸리므로 기다리지 않는다. 링크를 열면 그때의 결과가 보인다.
          $scanned = @()
          foreach ($f in @($setup, $exe)) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            if ($env:VT_API_KEY) {
              try {
                Invoke-RestMethod -Method Post -Uri "https://www.virustotal.com/api/v3/files" `
                  -Headers @{ 'x-apikey' = $env:VT_API_KEY } -Form @{ file = $f } | Out-Null
              } catch {
                Write-Warning "VirusTotal 업로드 실패 ($($f.Name)): $_"
              }
            }
            $scanned += "https://www.virustotal.com/gui/file/$hash"
          }

          $body = @"
          $notes

          ## 받기

          | 파일 | 설명 |
          |---|---|
          | ``$($setup.Name)`` | 설치판: 설치하고 시작 메뉴·바탕화면에서 실행. 새 버전이 나오면 앱 안에서 바로 업데이트돼요. |
          | ``$($zip.Name)`` | 포터블: 설치 없이 압축만 풀고 ``Moabom.exe`` 실행 |

          이미 설치판을 쓰고 있다면 앱의 설정 창에서 **업데이트 확인**을 눌러도 돼요.

          처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 눌러 주세요. 개인이 만든 프로그램이라 코드 서명이 없어서 나오는 안내예요.

          ## 바이러스 검사 (VirusTotal)

          - [설치판 검사 결과]($($scanned[0]))
          - [포터블 실행 파일(``Moabom.exe``) 검사 결과]($($scanned[1]))
          "@
          $body | Set-Content release-notes.md -Encoding utf8NoBOM

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: moabom
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            moabom_*_x64-portable.zip

      - name: 릴리스 생성
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 모아봄 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            moabom_*_x64-portable.zip
            latest.json
          generate_release_notes: true
